<section class="container py-5" style="max-width: 750px;">
  <div class="card border-0 shadow-sm">
    <div class="card-body p-4 p-md-5">

      <h2 class="fw-bold mb-4">Profile</h2>

      @if(isLoading()) {
      <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
      }


      @if(profile() && !isLoading()) {
      <div class="row py-3 border-bottom">
        <div class="col-4 fw-semibold">First name</div>
        <div class="col-8 text-secondary">{{profile()?.firstName}}</div>
      </div>

      <div class="row py-3 border-bottom">
        <div class="col-4 fw-semibold">Last name</div>
        <div class="col-8 text-secondary">{{profile()?.lastName}}</div>
      </div>

      <div class="row py-3 border-bottom">
        <div class="col-4 fw-semibold">Email</div>
        <div class="col-8 text-secondary">{{profile()?.email}}</div>
      </div>

      <div class="row py-3 border-bottom">
        <div class="col-4 fw-semibold">Phone</div>
        <div class="col-8 text-secondary">{{profile()?.phone}}</div>
      </div>

      <div class="row py-3 border-bottom">
        <div class="col-4 fw-semibold">Role</div>
        <div class="col-8 text-secondary">{{profile()?.role}}
        </div>
      </div>
      }

      <div class="d-flex justify-content-end mt-4">
        <button type="button" class="btn btn-outline-danger" (click)="auth.logout()">Log out</button>
      </div>

    </div>
  </div>
</section>
