<article class="d-flex justify-content-center align-items-center vh-100">
  <section class="card shadow-sm p-4" style="width: 450px;">
    <h2 class="text-center fw-bold mb-4">Log in</h2>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="needs-validation">


      <div class="mb-4">
        <label for="email" class="form-label fw-semibold">Email <span class="text-danger">*</span></label>
        <input type="email" class="form-control" [ngClass]="emailError.isInvalid() ? 'is-invalid' : ''" name="email"
          id="email" formControlName="email" required>

        <app-form-field-error #emailError [formErrorMessages]="formErrorMessages" controlName="email">
          <ng-template let-errorMsg="error">
            <div class="text-danger">
              {{ errorMsg() }}
            </div>
          </ng-template>
        </app-form-field-error>
      </div>

      <div class="mb-4">
        <label for="password" class="form-label fw-semibold">Password <span class="text-danger">*</span></label>
        <input type="password" class="form-control" [ngClass]="passwordError.isInvalid() ? 'is-invalid' : ''"
          name="password" id="password" formControlName="password" required>

        <app-form-field-error #passwordError [formErrorMessages]="formErrorMessages" controlName="password">
          <ng-template let-errorMsg="error">
            <div class="text-danger">
              {{ errorMsg() }}
            </div>
          </ng-template>
        </app-form-field-error>
      </div>


      <div class="form-check mb-4">
        <input class="form-check-input" type="checkbox" value="" formControlName="keepLoggedIn" id="invalidCheck"
          required>
        <label class="form-check-label" for="invalidCheck">
          Keep me logged in
        </label>

        <app-form-field-error #termsError [formErrorMessages]="formErrorMessages" controlName="terms">
          <ng-template let-errorMsg="error">
            <div class="text-danger">
              {{ errorMsg() }}
            </div>
          </ng-template>
        </app-form-field-error>
      </div>

      <button type="submit" [disabled]="isSubmitting()" class="btn btn-primary w-100">


        @if(!isSubmitting()) {
        <span>Log in</span>
        } @else {
        <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
        Logging in...
        }
      </button>
    </form>

    <p class="text-center mt-3 mb-0">
      Don't have an account? <a class="text-decoration-none" routerLink="/auth/register">Sign up</a>
    </p>
  </section>
</article>
