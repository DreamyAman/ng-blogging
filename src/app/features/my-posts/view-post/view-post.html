<body>

<div class="container py-5" style="max-width: 900px;">

  <a routerLink="/my-posts" class="text-decoration-none d-inline-flex align-items-center mb-4">
    &larr; <span class="ms-1" >Back</span>
  </a>

  <h1 class="fw-bold display-5 mb-3">{{title()}}</h1>

  @if(response().status==='PUBLISHED'){
    <span class="badge bg-success-subtle text-success border border-success-subtle px-3 py-2 rounded-2 fw-bold" style="font-size: .70rem; letter-spacing: .04em;">{{response().status}}</span>
    }
@else if(response().status==='DRAFT') {
    <span class="badge bg-warning-subtle text-warning-emphasis border border-warning-subtle fw-normal px-2 py-1">DRAFT</span>
    }
@else {
    <span class="badge bg-secondary-subtle text-muted border border-mute-subtle px-3 py-2 rounded-2 fw-bold" style="font-size: .70rem; letter-spacing: .04em;">{{response().status}}</span>
    }

  <p class="text-muted mb-4">
    {{name()}} . {{ date() | date:'dd MMM yyyy' }}
  </p>

  <p>{{content()}}</p>

  <div class="d-flex align-items-center gap-2">
    <button class="btn btn-outline-primary" routerLink="/my-posts/edit-post/{{id}}">
       Edit
    </button>
    <button class="btn btn-primary" (click)="updateBlogStatus(id,'DRAFT')" [disabled]="response().status === 'DRAFT'">
       Move to Draft
    </button>
    <button class="btn btn-light border" (click)="updateBlogStatus(id,'ARCHIVED')">
       Archive
    </button>
    <button class="btn btn-link text-danger text-decoration-none" type="button" data-bs-toggle="modal" data-bs-target="#confirmDelete">
       Delete
    </button>
  </div>

<div class="modal fade" id="confirmDelete" tabindex="-1" aria-labelledby="confirmDeleteLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h1 class="modal-title fs-5" id="confirmDeleteLabel">Delete Post?</h1>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        You won't be able to undo this process.
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
        <button type="button" class="btn btn-danger" (click)="deletePost()" data-bs-dismiss="modal">Delete Post</button>
      </div>
    </div>
  </div>
</div>

</div>

</body>
