<div class="container py-4" style="max-width: 900px;">
  <a routerLink="/my-posts" class="d-inline-flex align-items-center text-decoration-none mb-3">
    <i class="bi bi-arrow-left me-1"></i> Back
  </a>

  <h1 class="fw-bold mb-4">Edit post</h1>

  <form [formGroup]="editForm" (ngSubmit)="updatePost()">
    <div class="mb-4">
      <label for="postTitle" class="form-label text-secondary">Title</label>
      <input
  id="postTitle"
  type="text"
  class="form-control form-control-lg"
  name="title"
  formControlName="editTitle"
/>
    </div>

    <div class="mb-4">
      <label for="postContent" class="form-label text-secondary">Content</label>
      <textarea
  id="postContent"
  class="form-control"
  rows="8"
  name="content"
  formControlName="editContent"></textarea>
    </div>

    <div class="d-flex align-items-center gap-2 mb-4">
      <span class="text-secondary">Current status</span>
       @if(currentStatus()==='PUBLISHED'){
              <span class="badge bg-success-subtle text-success border border-success-subtle px-3 py-2 rounded-2 fw-bold" style="font-size: .70rem; letter-spacing: .04em;">{{currentStatus()}}</span>
            }
            @else if(currentStatus()==='DRAFT') {
              <span class="badge bg-warning-subtle text-warning-emphasis border border-warning-subtle fw-normal px-2 py-1">DRAFT</span>
            }
            @else {
                <span class="badge bg-secondary-subtle text-muted border border-mute-subtle px-3 py-2 rounded-2 fw-bold" style="font-size: .70rem; letter-spacing: .04em;">{{currentStatus()}}</span>
              }
    </div>

    <hr class="my-4" />

    <div class="d-flex justify-content-between align-items-center">
      <div class="d-flex gap-2">
        <button type="button" class="btn btn-light border" routerLink="/my-posts">Cancel</button>
        <button type="submit" class="btn btn-primary">Save changes</button>
      </div>
      <button class="btn btn-link text-danger text-decoration-none" type="button" data-bs-toggle="modal" data-bs-target="#confirmDelete">
       Delete
    </button>
    </div>

    <div class="modal fade" id="confirmDelete" tabindex="-1" aria-labelledby="confirmDeleteLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h1 class="modal-title fs-5" id="confirmDeleteLabel">Delete Post?</h1>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        You won't be able to undo this process.
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
        <button type="button" class="btn btn-danger" (click)="deletePost()" data-bs-dismiss="modal">Delete Post</button>
      </div>
    </div>
  </div>
</div>
  </form>

</div>
