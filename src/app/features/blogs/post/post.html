<div class="row g-4">

  @for (item of post()?.data; track item.id) {
  <div class="col-md-4" routerLink="/blogs/public-posts/{{item.id}}">
    <div class="card h-100 border rounded-3">
      <div class="card-body d-flex flex-column p-4">
        <span class="badge rounded-pill bg-success-subtle text-success mb-3 align-self-start px-3 py-2 fw-semibold" style="font-size: 0.75rem;">
          {{item.status}}
        </span>
        <h5 class="fw-bold mb-1">{{item.title}}</h5>
        <p class="text-secondary mb-3">{{`${item.authorId.firstName} ${item.authorId.lastName}`}}</p>
        <hr class="text-secondary-subtle my-2">
        <p class="text-secondary flex-grow-1 mb-2" style="height: 4.5rem; overflow: hidden; line-height: 1.5rem;">
          {{item.content}}
        </p>
        <hr class="text-secondary-subtle my-2">
        <div class="d-flex align-items-center text-secondary small pt-1">
          <i class="bi bi-calendar3 me-2"></i>
          {{ item.updatedAt | date:'dd MMM yyyy' }}
        </div>
      </div>
    </div>
  </div>
}

</div>

<div class="d-flex justify-content-center align-items-center gap-5 mt-5 pt-3">
  <button [class]="checkPageAvailble('prev') ? 'btn btn-outline-primary' : 'btn btn-light text-muted'"
  [disabled]="!checkPageAvailble('prev')" (click)="prevPage()">Previous</button>
  <span>Page{{page()}} </span>
  <button [class]="checkPageAvailble('next') ? 'btn btn-outline-primary' : 'btn btn-light text-muted'"
  [disabled]="!checkPageAvailble('next')"
  (click)="nextPage()">Next</button>
</div>


<p class="text-center text-secondary mt-2">3 posts</p>
