<body>

<div class="container py-5" style="max-width: 750px;">
  <div class="card border-0 shadow-sm">
    <div class="card-body p-4 p-md-5">

      <h2 class="fw-bold mb-4">Profile</h2>

      <div class="row py-3 border-bottom">
        <div class="col-4 fw-semibold">First name</div>
        <div class="col-8 text-secondary">{{profileInfo().firstName}}</div>
      </div>

      <div class="row py-3 border-bottom">
        <div class="col-4 fw-semibold">Last name</div>
        <div class="col-8 text-secondary">{{profileInfo().lastName}}</div>
      </div>

      <div class="row py-3 border-bottom">
        <div class="col-4 fw-semibold">Email</div>
        <div class="col-8 text-secondary">{{profileInfo().email}}</div>
      </div>

      <div class="row py-3 border-bottom">
        <div class="col-4 fw-semibold">Phone</div>
        <div class="col-8 text-secondary">{{profileInfo().phone}}</div>
      </div>

      <div class="row py-3 border-bottom">
        <div class="col-4 fw-semibold">Role</div>
        <div class="col-8 text-secondary">{{profileInfo().role}}</div>
      </div>

      <div class="d-flex justify-content-end mt-4">
        <button type="button" class="btn btn-outline-danger" (click)="logout()">Log out</button>
      </div>

    </div>
  </div>
</div>

</body>
