<body>
<form [formGroup] = 'newPostForm' (ngSubmit)="newPost()">
<div class="container py-5" style="max-width: 900px;">
  <div class="card border-0 shadow-sm">
    <div class="card-body p-4 p-md-5">

      <h2 class="fw-bold mb-4">New post</h2>

        <div class="mb-4">
          <label for="title" class="form-label">Title</label>
          <input type="text" class="form-control" id="title" formControlName = "title">
        </div>

        <div class="mb-4">
          <label for="content" class="form-label">Content</label>
          <textarea class="form-control" id="content" rows="6" formControlName = "content"></textarea>
        </div>
        
      </div>
      
      <div class="card-footer bg-white border-top d-flex justify-content-end gap-2 p-4">
        <button type="button" class="btn btn-light border">Cancel</button>
        <button type="submit" class="btn btn-primary" >Save draft</button>
      </div>
    </div>
  </div>
</form>

</body>
