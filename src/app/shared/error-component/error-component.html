@if (errors()===true) {
  <div class="alert alert-danger shadow-sm position-fixed end-0 me-4 d-flex align-items-start"
       style="top: 100px; max-width: 380px; z-index: 1050;">

    <i class="bi bi-exclamation-circle-fill me-2 mt-1"></i>

    <div class="flex-grow-1">
      <ul class="mb-0 ps-3 small">
        @for (error of errorList(); track $index) {
          <li>{{ error }}</li>
        }
      </ul>
    </div>

    <button type="button" class="btn-close ms-3"></button>
  </div>
}
